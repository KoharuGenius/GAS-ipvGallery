<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ibisPaint (.ipv) ギャラリー</title>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --text: #f0f0f0;
      --subtext: #a0a0a0;
      --accent: #3b82f6;
      --border: #2e2e2e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
    }
    header {
      max-width: 1200px;
      margin: 0 auto 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }
    h1 { font-size: 1.4rem; font-weight: 600; }
    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    input[type="text"] {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      width: 260px;
      font-size: 0.9rem;
    }
    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.9rem;
    }
    button:hover { opacity: 0.9; }
    #status {
      max-width: 1200px;
      margin: 0 auto 16px;
      color: var(--subtext);
      font-size: 0.9rem;
    }
    .gallery {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.15s ease;
    }
    .card:hover { transform: translateY(-3px); }
    .thumb-box {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #262626;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }
    .thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .meta {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .title {
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .info {
      font-size: 0.8rem;
      color: var(--subtext);
      display: flex;
      justify-content: space-between;
    }
    .drive-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.8rem;
      margin-top: 4px;
      display: inline-block;
    }
    /* 拡大モーダル */
    #modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    #modal.active { display: flex; }
    #modal img {
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

<header>
  <h1>🎨 ibisPaint (.ipv) ギャラリー</h1>
  <div class="controls">
    <input type="text" id="folderId" placeholder="フォルダID（空欄でドライブ全体）">
    <button onclick="loadGallery()">読み込み</button>
  </div>
</header>

<div id="status">「読み込み」ボタンを押すとGoogle Drive内の .ipv ファイルを検索します。</div>
<div class="gallery" id="gallery"></div>

<div id="modal" onclick="closeModal()">
  <img id="modalImg" src="" alt="Preview">
</div>

<script>
  window.onload = loadGallery;

  function loadGallery() {
    const folderId = document.getElementById('folderId').value.trim();
    const gallery = document.getElementById('gallery');
    const status = document.getElementById('status');

    gallery.innerHTML = '';
    status.textContent = 'ファイル一覧を検索中...';

    google.script.run
      .withSuccessHandler(renderCards)
      .withFailureHandler(err => {
        status.textContent = 'エラー: ' + err.message;
      })
      .getIpvFileList(folderId);
  }

  function renderCards(files) {
    const gallery = document.getElementById('gallery');
    const status = document.getElementById('status');

    if (!files || files.length === 0) {
      status.textContent = '.ipv ファイルが見つかりませんでした。';
      return;
    }

    status.textContent = `${files.length} 件の .ipv ファイルが見つかりました（サムネイルを順次抽出中...）`;

    files.forEach(file => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="thumb-box" id="thumb-${file.id}">
          <div class="spinner"></div>
        </div>
        <div class="meta">
          <div class="title" title="${file.name}">${file.name}</div>
          <div class="info">
            <span>${file.updated}</span>
            <span>${file.sizeKB} KB</span>
          </div>
          <a class="drive-link" href="${file.url}" target="_blank" rel="noopener">Driveで開く ↗</a>
        </div>
      `;
      gallery.appendChild(card);

      // サムネイルを非同期で1件ずつ取得（キャッシュ利用または抽出）
      google.script.run
        .withSuccessHandler(res => {
          const box = document.getElementById(`thumb-${file.id}`);
          if (res.success) {
            const img = document.createElement('img');
            img.src = res.dataUrl;
            img.alt = file.name;
            box.innerHTML = '';
            box.appendChild(img);
            box.onclick = () => openModal(res.dataUrl);
          } else {
            box.innerHTML = `<span style="font-size:0.75rem;color:#888;padding:8px;text-align:center;">${res.error}</span>`;
          }
        })
        .withFailureHandler(err => {
          const box = document.getElementById(`thumb-${file.id}`);
          box.innerHTML = `<span style="font-size:0.75rem;color:#e55;">読込失敗</span>`;
        })
        .extractPreviewPngBase64(file.id);
    });
  }

  function openModal(src) {
    document.getElementById('modalImg').src = src;
    document.getElementById('modal').classList.add('active');
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('active');
  }
</script>

</body>
</html>
