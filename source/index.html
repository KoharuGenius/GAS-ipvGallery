<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ibisPaint (.ipv) ギャラリー</title>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --text: #f0f0f0;
      --subtext: #a0a0a0;
      --accent: #3b82f6;
      --border: #2e2e2e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
    }
    header {
      max-width: 1200px;
      margin: 0 auto 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }
    h1 { font-size: 1.4rem; font-weight: 600; }
    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    input[type="text"], select {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    input[type="text"] {
      width: 280px;
    }
    select {
      cursor: pointer;
    }
    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.9rem;
    }
    button:hover:not(:disabled) { opacity: 0.9; }
    button:disabled {
      background: #2a2a2a;
      color: #666;
      cursor: not-allowed;
    }
    #status {
      max-width: 1200px;
      margin: 0 auto 16px;
      color: var(--subtext);
      font-size: 0.9rem;
    }
    .gallery {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.15s ease;
    }
    .card:hover { transform: translateY(-3px); }
    .thumb-box {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #262626;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }
    .thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .meta {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .title {
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .info {
      font-size: 0.8rem;
      color: var(--subtext);
      display: flex;
      justify-content: space-between;
    }
    .card-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
      padding-top: 6px;
      border-top: 1px solid var(--border);
    }
    .drive-link {
      color: var(--subtext);
      text-decoration: none;
      font-size: 0.8rem;
    }
    .drive-link:hover {
      color: var(--text);
      text-decoration: underline;
    }
    .dl-btn {
      background: rgba(59, 130, 246, 0.15);
      color: var(--accent);
      border: 1px solid rgba(59, 130, 246, 0.4);
      padding: 4px 10px;
      border-radius: 5px;
      font-size: 0.8rem;
      font-weight: 500;
      text-decoration: none;
      transition: background 0.15s ease;
    }
    .dl-btn:hover {
      background: var(--accent);
      color: #fff;
    }
    .pagination {
      max-width: 1200px;
      margin: 28px auto 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
    }
    #pageInfo {
      font-size: 0.9rem;
      color: var(--subtext);
    }
    #modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    #modal.active { display: flex; }
    #modal img {
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

<header>
  <h1>🎨 ibisPaint (.ipv) ギャラリー</h1>
  <div class="controls">
    <input type="text" id="folderInput" placeholder="DriveのフォルダURL または IDを貼り付け">
    <select id="sortSelect" onchange="applySortAndRender()">
      <option value="time-desc">更新日時（新しい順）</option>
      <option value="time-asc">更新日時（古い順）</option>
      <option value="name-asc">ファイル名（昇順 A→Z）</option>
      <option value="name-desc">ファイル名（降順 Z→A）</option>
    </select>
    <button onclick="loadGallery()">読み込み</button>
  </div>
</header>

<div id="status">Google DriveのフォルダURL（またはID）を貼り付けて「読み込み」を押してください。</div>
<div class="gallery" id="gallery"></div>

<div class="pagination" id="pagination" style="display: none;">
  <button id="prevBtn" onclick="changePage(-1)">← 前へ</button>
  <span id="pageInfo">1 / 1 ページ</span>
  <button id="nextBtn" onclick="changePage(1)">次へ →</button>
</div>

<div id="modal" onclick="closeModal()">
  <img id="modalImg" src="" alt="Preview">
</div>

<script>
  // ★ 1ページあたりに表示するプレビュー画像数
  const ITEMS_PER_PAGE = 10;
  const STORAGE_KEY = 'ipv_gallery_last_folder_id';

  let allFiles = [];
  let activeFolderId = '';
  let currentPage = 1;
  let renderGeneration = 0;

  // ページを開いたときに前回使ったフォルダIDがあれば自動入力
  window.onload = () => {
    const savedId = localStorage.getItem(STORAGE_KEY);
    if (savedId) {
      document.getElementById('folderInput').value = savedId;
      //loadGallery();
    }
  };

  // URLまたはID文字列からフォルダIDだけを抽出する
  function extractFolderId(input) {
    const trimmed = input.trim();
    if (!trimmed) return '';

    // 例: https://drive.google.com/drive/folders/1a2b3c4d5e...?usp=sharing
    const folderMatch = trimmed.match(/\/folders\/([a-zA-Z0-9_-]+)/);
    if (folderMatch) return folderMatch[1];

    // 例: https://drive.google.com/open?id=1a2b3c4d5e...
    const idParamMatch = trimmed.match(/[?&]id=([a-zA-Z0-9_-]+)/);
    if (idParamMatch) return idParamMatch[1];

    // すでにIDだけが入力されている場合はそのまま返す
    return trimmed;
  }

  function loadGallery() {
    const rawInput = document.getElementById('folderInput').value;
    const folderId = extractFolderId(rawInput);
    const gallery = document.getElementById('gallery');
    const status = document.getElementById('status');
    const pagination = document.getElementById('pagination');

    if (!folderId) {
      status.textContent = '⚠ フォルダのURLまたはIDを入力してください。';
      return;
    }

    // 抽出したIDを入力欄にセットし、ブラウザに記憶
    document.getElementById('folderInput').value = folderId;
    localStorage.setItem(STORAGE_KEY, folderId);

    activeFolderId = folderId;
    gallery.innerHTML = '';
    pagination.style.display = 'none';
    status.textContent = 'ファイル一覧を検索中...';

    google.script.run
      .withSuccessHandler(files => {
        allFiles = files || [];
        if (allFiles.length === 0) {
          status.textContent = '指定されたフォルダ内に .ipv ファイルが見つかりませんでした。';
          return;
        }
        applySortAndRender();
      })
      .withFailureHandler(err => {
        status.textContent = 'エラー: ' + err.message;
      })
      .getIpvFileList(activeFolderId);
  }

  function applySortAndRender() {
    if (allFiles.length === 0) return;

    const sortType = document.getElementById('sortSelect').value;

    allFiles.sort((a, b) => {
      switch (sortType) {
        case 'time-desc':
          return b.updatedTime - a.updatedTime;
        case 'time-asc':
          return a.updatedTime - b.updatedTime;
        case 'name-asc':
          return a.name.localeCompare(b.name, 'ja', { numeric: true });
        case 'name-desc':
          return b.name.localeCompare(a.name, 'ja', { numeric: true });
        default:
          return 0;
      }
    });

    currentPage = 1;
    renderCurrentPage();
  }

  function changePage(delta) {
    const totalPages = Math.ceil(allFiles.length / ITEMS_PER_PAGE);
    const next = currentPage + delta;
    if (next < 1 || next > totalPages) return;

    currentPage = next;
    renderCurrentPage();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function renderCurrentPage() {
    const gallery = document.getElementById('gallery');
    const status = document.getElementById('status');
    const pagination = document.getElementById('pagination');

    renderGeneration++;
    const currentGen = renderGeneration;

    const totalCount = allFiles.length;
    const totalPages = Math.ceil(totalCount / ITEMS_PER_PAGE);
    const startIdx = (currentPage - 1) * ITEMS_PER_PAGE;
    const endIdx = Math.min(startIdx + ITEMS_PER_PAGE, totalCount);
    const pageFiles = allFiles.slice(startIdx, endIdx);

    status.textContent = `全 ${totalCount} 件中 ${startIdx + 1}〜${endIdx} 件目を表示中`;
    gallery.innerHTML = '';

    if (totalPages > 1) {
      pagination.style.display = 'flex';
      document.getElementById('pageInfo').textContent = `${currentPage} / ${totalPages} ページ`;
      document.getElementById('prevBtn').disabled = (currentPage === 1);
      document.getElementById('nextBtn').disabled = (currentPage === totalPages);
    } else {
      pagination.style.display = 'none';
    }

    pageFiles.forEach(file => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="thumb-box" id="thumb-${file.id}">
          <div class="spinner"></div>
        </div>
        <div class="meta">
          <div class="title" title="${escapeHtml(file.name)}">${escapeHtml(file.name)}</div>
          <div class="info">
            <span>${file.updated}</span>
            <span>${file.sizeKB} KB</span>
          </div>
          <div class="card-actions">
            <a class="drive-link" href="${file.url}" target="_blank" rel="noopener">Driveで開く ↗</a>
            <a class="dl-btn" href="${file.downloadUrl}" download="${escapeHtml(file.name)}" target="_blank" rel="noopener">⬇ ダウンロード</a>
          </div>
        </div>
      `;
      gallery.appendChild(card);

      google.script.run
        .withSuccessHandler(res => {
          if (currentGen !== renderGeneration) return;

          const box = document.getElementById(`thumb-${file.id}`);
          if (!box) return;

          if (res.success) {
            const img = document.createElement('img');
            img.src = res.dataUrl;
            img.alt = file.name;
            box.innerHTML = '';
            box.appendChild(img);
            box.onclick = () => openModal(res.dataUrl);
          } else {
            box.innerHTML = `<span style="font-size:0.75rem;color:#888;padding:8px;text-align:center;">${res.error}</span>`;
          }
        })
        .withFailureHandler(err => {
          if (currentGen !== renderGeneration) return;
          const box = document.getElementById(`thumb-${file.id}`);
          if (box) {
            box.innerHTML = `<span style="font-size:0.75rem;color:#e55;">読込失敗</span>`;
          }
        })
        .extractPreviewPngBase64(file.id, activeFolderId);
    });
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
  }

  function openModal(src) {
    document.getElementById('modalImg').src = src;
    document.getElementById('modal').classList.add('active');
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('active');
  }
</script>

</body>
</html>
